# smart-trip-plan 本地开发基础设施（C-003 AC-1）
# 一键启动：docker compose up -d   （在本目录或加 -f docker/docker-compose.yml）
# 仅供本地开发/联调（非生产编排：不含 K8s/HA，ADR-003/006）。
# 端口与口令可经同目录 .env 覆盖（参见 ../.env.example）。
services:
  nacos:
    image: nacos/nacos-server:v3.2.0
    container_name: smart_trip-nacos
    environment:
      # 单机模式；A2A 注册逻辑归 C-005，本期仅保证 Nacos 可达
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
      - NACOS_AUTH_TOKEN=SGVsbG9Xb3JsZFRoaXNJc0FTZWNyZXRLZXlZb3VyU2VjcmV0Cg==
      - NACOS_AUTH_IDENTITY_KEY=nacos      # 新增
      - NACOS_AUTH_IDENTITY_VALUE=nacos    # 新增
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
    ports:
      - "${NACOS_PORT:-8848}:8080"  # 主机 8848 → 容器 8080（Nacos Console 实际端口）
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data   # 持久化
    healthcheck:
      # Nacos 3.x readiness 探针；若镜像无 curl 可改用 wget 或 TCP 探测
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: smart_trip-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: smart_trip_plan
      MYSQL_USER: ${MYSQL_USER:-smart_trip}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smart_trip}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../smart-trip-server/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql:ro
      - ./mysql/init/V001__trace_tables.sql:/docker-entrypoint-initdb.d/02-trace-tables.sql:ro
      - ./mysql/init/V002__plan_persistence.sql:/docker-entrypoint-initdb.d/03-plan-persistence.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smart_trip-redis
    # 安全红线：Redis 必须设访问口令（编码规范 §7）；口令来自 .env，不入库
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-smart_trip}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-smart_trip}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # C-015 T-1：ReMe 长期记忆服务（AgentScope 官方，Python HTTP 后端）
  # LLM 用于记忆摘要提取，Embedding 用于向量检索；密钥从 .env 注入
  # 镜像改为源码安装（见 ./reme/Dockerfile 注释）：PyPI 最新版 reme-ai==0.4.0.6
  # 的 as_embedding 组件有 dimensions 未透传的 bug，修复仅存在于 GitHub main，
  # 尚未发布新版本，故锁定 commit 从源码构建。
  reme:
    build:
      context: ./reme
      dockerfile: Dockerfile
    container_name: smart_trip-reme
    command: ["reme", "start", "service.port=8002", "--service.embedding.dimensions=1024"]
    ports:
      - "${REME_PORT:-8002}:8002"
    environment:
      - LLM_API_KEY=${DEEPSEEK_API_KEY}
      - LLM_BASE_URL=https://api.deepseek.com/v1
      # Embedding 使用 DashScope text-embedding-v4（DeepSeek 无公开 embedding 端点）
      - EMBEDDING_API_KEY=${DASHSCOPE_API_KEY}
      - EMBEDDING_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - EMBEDDING_MODEL=text-embedding-v4
      - EMBEDDING_DIMENSIONS=1024    # text-embedding-v4 支持 64–1024，1024 为最大精度
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/version -H 'Content-Type: application/json' -d '{}' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  nacos-data:
  mysql-data:
