# 开发联调 profile（C-003）：连接参数全部来自环境变量/配置中心（AC-3）。
# 启用环境变量 fail-fast：缺少 DEEPSEEK_API_KEY（主 LLM）/ DASHSCOPE_API_KEY（降级 LLM）/ BAIDU_MAP_AK 时启动即报错点名变量（AC-4 / ADR-009）。
spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

trip:
  nacos:
    server-addr: ${NACOS_SERVER_ADDR}
  env:
    validation:
      enabled: true
  # C-010：开发联调 MySQL 审计追踪（全部来自环境变量，fail-fast）
  trace:
    datasource:
      host: ${TRACE_DB_HOST}
      port: ${TRACE_DB_PORT:3306}
      database: ${TRACE_DB_NAME:smart_trip_plan_trace}
      username: ${TRACE_DB_USERNAME}
      password: ${TRACE_DB_PASSWORD}
      pool-size: ${TRACE_DB_POOL_SIZE:4}
